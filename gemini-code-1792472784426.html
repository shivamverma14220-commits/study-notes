<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Textbook - Study Notes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slatebg: '#F8FAFC',
                        darkgray: '#1E293B',
                        accentblue: '#2563EB',
                        accentlight: '#EFF6FF'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slatebg text-darkgray font-sans antialiased h-screen flex overflow-hidden">

    <!-- Left Sidebar -->
    <aside class="w-72 bg-white border-r border-slate-200 flex flex-col justify-between hidden md:flex">
        <!-- Sidebar Header -->
        <div class="p-6 border-b border-slate-100">
            <h1 class="text-xl font-bold tracking-tight text-darkgray flex items-center gap-2">
                <svg class="w-6 h-6 text-accentblue" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                StudyNotes<span class="text-accentblue">.</span>
            </h1>
            <p class="text-xs text-slate-400 mt-1">Digital Textbook & Key Points</p>
        </div>

        <!-- Subject List Navigation -->
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <p class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Subjects</p>
            
            <button onclick="switchSubject('physics')" id="btn-physics" class="subject-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition-all bg-accentlight text-accentblue">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
                Physics
            </button>

            <button onclick="switchSubject('chemistry')" id="btn-chemistry" class="subject-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-600 hover:bg-slate-50 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
                Chemistry
            </button>

            <button onclick="switchSubject('biology')" id="btn-biology" class="subject-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-slate-600 hover:bg-slate-50 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                Biology
            </button>
        </nav>

        <!-- Sidebar Footer -->
        <div class="p-4 border-t border-slate-100">
            <div class="flex items-center gap-3 px-3 py-2 bg-slate-50 rounded-xl">
                <div class="w-8 h-8 rounded-full bg-accentblue text-white flex items-center justify-center font-bold text-xs">ST</div>
                <div>
                    <p class="text-xs font-medium text-darkgray">Student Edition</p>
                    <p class="text-[10px] text-slate-400">v1.0.0 Active</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-slatebg">
        
        <!-- Top Search Bar Header -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 md:hidden">
                <!-- Mobile Menu Toggles or Title -->
                <span class="font-bold text-darkgray">StudyNotes</span>
            </div>
            
            <div class="relative flex-1 max-w-xl">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </span>
                <input type="text" id="searchInput" oninput="filterKeyPoints()" placeholder="Filter key points by keywords (e.g., velocity, cell, bonding)..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-accentblue focus:bg-white transition-all">
            </div>

            <div class="flex items-center gap-3">
                <span id="activeSubjectBadge" class="px-3 py-1 bg-accentlight text-accentblue rounded-full text-xs font-semibold uppercase tracking-wider">Physics</span>
            </div>
        </header>

        <!-- Scrollable Notes Panel -->
        <div class="flex-1 overflow-y-auto p-6 md:p-10">
            <div class="max-w-4xl mx-auto">
                
                <!-- Subject Banner Title -->
                <div class="mb-8">
                    <h2 id="subjectTitle" class="text-3xl font-bold text-darkgray tracking-tight">Physics Notes</h2>
                    <p id="subjectSubtitle" class="text-slate-500 mt-1">Core concepts, laws, and foundational principles.</p>
                </div>

                <!-- Accordions Container -->
                <div id="accordionContainer" class="space-y-4">
                    <!-- Dynamically populated via JavaScript -->
                </div>

            </div>
        </div>

    </main>

    <!-- JavaScript Application Logic -->
    <script>
        // Database of study notes structured by subject and collapsible subtopics
        const notesData = {
            physics: {
                title: "Physics Notes",
                subtitle: "Mechanics, Thermodynamics, and Electromagnetism fundamentals.",
                subtopics: [
                    {
                        title: "1. Kinematics & Laws of Motion",
                        summary: "Study of motion without considering its causes, alongside Newton's fundamental laws.",
                        points: [
                            "Newton's First Law (Inertia): An object at rest stays at rest, and an object in motion stays in motion unless acted upon by an external force.",
                            "Newton's Second Law: Force equals mass times acceleration ($F = ma$).",
                            "Newton's Third Law: For every action, there is an equal and opposite reaction.",
                            "Kinematic Equations: Relates displacement ($s$), initial velocity ($u$), final velocity ($v$), acceleration ($a$), and time ($t$). Key formula: $v = u + at$."
                        ]
                    },
                    {
                        title: "2. Work, Energy, and Power",
                        summary: "Conservation principles and the capacity to do mechanical work.",
                        points: [
                            "Work ($W$): Defined as the dot product of force and displacement ($W = F \\cdot d \\cos\\theta$). Measured in Joules.",
                            "Kinetic Energy: Energy of motion, given by $KE = \\frac{1}{2}mv^2$.",
                            "Potential Energy: Stored energy relative to position, such as gravitational potential energy ($PE = mgh$).",
                            "Conservation of Energy: Total energy in an isolated system remains constant over time."
                        ]
                    },
                    {
                        title: "3. Electromagnetism & Circuits",
                        summary: "Behavior of electric charges, currents, and magnetic fields.",
                        points: [
                            "Ohm's Law: Current flowing through a conductor between two points is directly proportional to the voltage ($V = IR$).",
                            "Electrical Power: Rate of energy transfer calculated as $P = VI$ or $P = I^2R$.",
                            "Magnetic Flux: Measurement of the total magnetic field passing through a given surface area.",
                            "Electromagnetic Induction: Faraday's Law states that a change in magnetic environment induces an electromotive force (EMF)."
                        ]
                    }
                ]
            },
            chemistry: {
                title: "Chemistry Notes",
                subtitle: "Atomic structure, chemical bonding, and reaction kinetics.",
                subtopics: [
                    {
                        title: "1. Atomic Structure & Periodicity",
                        summary: "Subatomic particles, electron configurations, and periodic trends.",
                        points: [
                            "Bohr Model: Electrons orbit the nucleus in quantized energy levels without radiating energy.",
                            "Quantum Numbers: Principal ($n$), angular momentum ($l$), magnetic ($m_l$), and spin ($m_s$) completely describe an electron.",
                            "Electronegativity: Ability of an atom to attract shared electrons in a chemical bond, increasing across a period.",
                            "Ionization Energy: Energy required to remove an outermost electron from a gaseous atom."
                        ]
                    },
                    {
                        title: "2. Chemical Bonding & Molecular Geometry",
                        summary: "Ionic, covalent interactions, and VSEPR theory shapes.",
                        points: [
                            "Ionic Bonding: Electrostatic attraction between oppositely charged ions resulting from complete electron transfer.",
                            "Covalent Bonding: Sharing of electron pairs between nonmetal atoms to achieve noble gas stability.",
                            "VSEPR Theory: Valence Shell Electron Pair Repulsion theory predicts molecular shapes based on minimizing lone pair and bond pair repulsion.",
                            "Hydrogen Bonding: Strong dipole-dipole attraction occurring when hydrogen is bonded to fluorine, oxygen, or nitrogen."
                        ]
                    },
                    {
                        title: "3. Acids, Bases, and Equilibrium",
                        summary: "pH scale, neutralization, and dynamic chemical equilibrium.",
                        points: [
                            "Brønsted-Lowry Theory: Acids are proton donors, and bases are proton acceptors.",
                            "pH Scale: Logarithmic scale measuring hydrogen ion concentration: $pH = -\\log[H^+]$.",
                            "Le Chatelier's Principle: If a dynamic equilibrium is disturbed, the position shifts to counteract the change.",
                            "Buffer Solutions: Mixtures of weak acids and conjugate bases that resist drastic pH changes."
                        ]
                    }
                ]
            },
            biology: {
                title: "Biology Notes",
                subtitle: "Cellular biology, genetics, and physiological systems.",
                subtopics: [
                    {
                        title: "1. Cell Structure & Function",
                        summary: "Organelles, membrane transport, and cellular bioenergetics.",
                        points: [
                            "Plasma Membrane: Phospholipid bilayer providing selective permeability via active and passive transport.",
                            "Mitochondria: Powerhouse of the cell, generating ATP through cellular respiration and oxidative phosphorylation.",
                            "Ribosomes: Macromolecular complexes responsible for cellular protein synthesis guided by mRNA templates.",
                            "Endoplasmic Reticulum: Rough ER synthesizes membrane proteins, while Smooth ER synthesizes lipids and detoxifies chemicals."
                        ]
                    },
                    {
                        title: "2. Genetics & DNA Replication",
                        summary: "Molecular basis of heredity, transcription, and translation.",
                        points: [
                            "DNA Double Helix: Antiparallel strands composed of nucleotide base pairs connected by hydrogen bonds (A-T, G-C).",
                            "Central Dogma: Genetic information flows sequentially from DNA to RNA via transcription, and RNA to protein via translation.",
                            "Mitosis vs. Meiosis: Mitosis produces two identical somatic diploid cells; meiosis produces four unique haploid gametes.",
                            "Mendelian Inheritance: Law of segregation and law of independent assortment govern genetic trait transmission."
                        ]
                    },
                    {
                        title: "3. Human Physiology & Homeostasis",
                        summary: "Internal balance and organ system coordination.",
                        points: [
                            "Homeostasis: Regulation of internal conditions (such as temperature and glucose) within stable physiological limits.",
                            "Action Potential: Rapid electrical impulse transmission across neuronal membranes driven by sodium-potassium ion pumps.",
                            "Circulatory System: Transports oxygen, nutrients, and waste through the heart, arteries, capillaries, and veins.",
                            "Immune Response: Innate barriers combined with adaptive immunity utilizing B-cells and T-cells to neutralize pathogens."
                        ]
                    }
                ]
            }
        };

        let currentSubject = 'physics';

        // Switch between Physics, Chemistry, Biology
        function switchSubject(subjectKey) {
            currentSubject = subjectKey;
            
            // Update active button styles in sidebar
            document.querySelectorAll('.subject-btn').forEach(btn => {
                btn.classList.remove('bg-accentlight', 'text-accentblue');
                btn.classList.add('text-slate-600', 'hover:bg-slate-50');
            });
            const activeBtn = document.getElementById(`btn-${subjectKey}`);
            activeBtn.classList.remove('text-slate-600', 'hover:bg-slate-50');
            activeBtn.classList.add('bg-accentlight', 'text-accentblue');

            // Update Header & Badge
            document.getElementById('activeSubjectBadge').innerText = subjectKey.charAt(0).toUpperCase() + subjectKey.slice(1);
            document.getElementById('subjectTitle').innerText = notesData[subjectKey].title;
            document.getElementById('subjectSubtitle').innerText = notesData[subjectKey].subtitle;

            // Clear search bar when switching subjects
            document.getElementById('searchInput').value = '';

            renderAccordions();
        }

        // Render accordions for current subject
        function renderAccordions(filterKeyword = '') {
            const container = document.getElementById('accordionContainer');
            container.innerHTML = '';

            const subtopics = notesData[currentSubject].subtopics;
            let matchFound = false;

            subtopics.forEach((sub, index) => {
                // Filter points based on keyword
                const filteredPoints = sub.points.filter(point => 
                    point.toLowerCase().includes(filterKeyword.toLowerCase()) ||
                    sub.title.toLowerCase().includes(filterKeyword.toLowerCase()) ||
                    sub.summary.toLowerCase().includes(filterKeyword.toLowerCase())
                );

                if (filterKeyword && filteredPoints.length === 0) return;
                matchFound = true;

                // Create Accordion Card Wrapper
                const card = document.createElement('div');
                card.className = 'bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden transition-all';

                // Accordion Header Button
                const headerBtn = document.createElement('button');
                headerBtn.className = 'w-full px-6 py-5 text-left flex items-center justify-between gap-4 focus:outline-none hover:bg-slate-50/50 transition-colors';
                headerBtn.onclick = () => toggleAccordion(index);

                headerBtn.innerHTML = `
                    <div>
                        <h3 class="font-semibold text-darkgray text-lg">${sub.title}</h3>
                        <p class="text-xs text-slate-400 mt-0.5">${sub.summary}</p>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 transition-transform duration-200" id="icon-${index}">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                    </div>
                `;

                // Accordion Content Panel
                const contentDiv = document.createElement('div');
                contentDiv.id = `content-${index}`;
                // Default open first item, or open all if searching
                const isOpen = filterKeyword ? true : (index === 0);
                contentDiv.className = `px-6 pb-6 pt-2 border-t border-slate-100 ${isOpen ? '' : 'hidden'}`;

                // Mark header icon state
                const iconEl = headerBtn.querySelector(`#icon-${index}`);
                if (isOpen) {
                    iconEl.classList.add('rotate-180');
                }

                let pointsHTML = '<ul class="space-y-3 mt-3">';
                filteredPoints.forEach(point => {
                    // Highlight matching keywords if search active
                    let displayPoint = point;
                    if (filterKeyword) {
                        const regex = new RegExp(`(${filterKeyword})`, 'gi');
                        displayPoint = point.replace(regex, '<mark class="bg-yellow-100 text-darkgray rounded px-1">\$1</mark>');
                    }
                    pointsHTML += `
                        <li class="flex items-start gap-3 text-sm text-slate-600 leading-relaxed">
                            <span class="w-1.5 h-1.5 rounded-full bg-accentblue mt-2 shrink-0"></span>
                            <span>${displayPoint}</span>
                        </li>
                    `;
                });
                pointsHTML += '</ul>';

                contentDiv.innerHTML = pointsHTML;

                card.appendChild(headerBtn);
                card.appendChild(contentDiv);
                container.appendChild(card);
            });

            if (!matchFound) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white border border-slate-200 rounded-2xl">
                        <p class="text-slate-400 text-sm">No key points found matching "${filterKeyword}".</p>
                    </div>
                `;
            }
        }

        // Toggle individual accordion collapse state
        function toggleAccordion(index) {
            const content = document.getElementById(`content-${index}`);
            const icon = document.getElementById(`icon-${index}`);
            
            content.classList.toggle('hidden');
            icon.classList.toggle('rotate-180');
        }

        // Live keyword search filter
        function filterKeyPoints() {
            const query = document.getElementById('searchInput').value.trim();
            renderAccordions(query);
        }

        // Initialize view on load
        window.onload = () => {
            renderAccordions();
        };
    </script>
</body>
</html>
